[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epsr26"
version = "0.0.1"
description = "Line-by-line Python translation of the EPSR26 Fortran suite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
dev = ["pytest", "pexpect", "psutil", "ruff"]

[project.scripts]
epsrshell = "epsr26.shell.epsrshell:entry"

[tool.hatch.build.targets.wheel]
packages = ["src/epsr26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full validation runs (chain mode)"]

[tool.ruff]
line-length = 120
extend-exclude = ["fortran_src", "fortran_build"]

[tool.ruff.lint]
# Translated code mirrors the Fortran: long lines, short names (l, O, I), and
# `from ..fortran import *` for the compatibility layer.
select = ["E", "F", "W"]
ignore = ["E501", "E741", "E731", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
